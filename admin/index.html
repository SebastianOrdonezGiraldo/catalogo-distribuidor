<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Catálogos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0a0f1e 0%,#1a1a3e 50%,#0d1b2a 100%);color:#e2e8f0;overflow-x:hidden}
    .hidden{display:none!important}

    /* Toast */
    #toast-container{position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px}
    .toast{padding:14px 20px;border-radius:12px;font-size:14px;font-weight:500;color:#fff;backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,.4);animation:toastIn .4s ease;display:flex;align-items:center;gap:10px;max-width:380px}
    .toast.ok{background:rgba(34,197,94,.2);border:1px solid rgba(34,197,94,.4)}
    .toast.error{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4)}
    .toast.info{background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.4)}
    .toast.out{animation:toastOut .3s ease forwards}
    @keyframes toastIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
    @keyframes toastOut{to{opacity:0;transform:translateX(60px)}}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:1000;display:flex;justify-content:center;align-items:center;animation:fadeIn .2s ease}
    .modal-box{background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;max-width:420px;width:90%;text-align:center;animation:scaleIn .25s ease}
    .modal-box h3{font-size:20px;margin-bottom:8px;color:#f1f5f9}
    .modal-box p{color:#94a3b8;font-size:14px;margin-bottom:24px;line-height:1.5}
    .modal-actions{display:flex;gap:12px;justify-content:center}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

    /* Login */
    #login-section{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
    .login-card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:48px 40px;max-width:420px;width:100%;animation:scaleIn .5s ease}
    .login-card .logo-wrap{text-align:center;margin-bottom:28px}
    .login-card .logo-wrap img{width:120px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
    .login-card h1{font-size:24px;text-align:center;margin-bottom:6px;color:#f1f5f9}
    .login-card .subtitle{text-align:center;font-size:14px;color:#94a3b8;margin-bottom:28px}
    .field{margin-bottom:16px;position:relative}
    .field label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px;font-weight:500}
    .field input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px 12px 42px;font-size:14px;color:#f1f5f9;font-family:inherit;outline:none;transition:border .2s}
    .field input:focus{border-color:#8FC440}
    .field .icon{position:absolute;left:14px;bottom:12px;color:#64748b;pointer-events:none}
    .btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit;transition:all .25s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:linear-gradient(135deg,#8FC440,#6da030);color:#fff;width:100%;box-shadow:0 4px 15px rgba(143,196,64,.3)}
    .btn-primary:hover{box-shadow:0 6px 25px rgba(143,196,64,.5);transform:translateY(-1px)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .btn-secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#e2e8f0}
    .btn-secondary:hover{background:rgba(255,255,255,.14)}
    .btn-danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
    .btn-danger:hover{background:rgba(239,68,68,.25)}
    .btn-danger:disabled{opacity:.4;cursor:not-allowed}
    .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.12);color:#94a3b8}
    .btn-ghost:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
    .btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Dashboard */
    #dashboard-section{padding:24px;max-width:1200px;margin:0 auto;animation:fadeIn .4s ease}
    .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px}
    .topbar h1{font-size:26px;color:#f1f5f9;display:flex;align-items:center;gap:10px}
    .topbar .session-info{font-size:13px;color:#64748b;margin-top:4px}
    .topbar-actions{display:flex;gap:10px}

    /* Document Cards */
    .docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
    .doc-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:24px;transition:all .3s;position:relative;overflow:hidden}
    .doc-card:hover{border-color:rgba(143,196,64,.3);background:rgba(255,255,255,.06);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.2)}
    .doc-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
    .doc-card-title{font-size:16px;font-weight:600;color:#f1f5f9;margin-bottom:4px}
    .doc-card-filename{font-size:12px;color:#64748b;word-break:break-all}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
    .pill.ok{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
    .pill.off{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.15)}
    .pill-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
    .pill.ok .pill-dot{background:#4ade80}
    .pill.off .pill-dot{background:#f87171}
    .doc-meta{display:flex;gap:20px;margin-bottom:18px;font-size:13px;color:#94a3b8}
    .doc-meta span{display:flex;align-items:center;gap:5px}
    .doc-actions{display:flex;flex-direction:column;gap:10px}
    .doc-actions-row{display:flex;gap:8px;flex-wrap:wrap}

    /* Drop zone */
    .drop-zone{border:2px dashed rgba(255,255,255,.12);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .25s;position:relative}
    .drop-zone:hover,.drop-zone.dragover{border-color:rgba(143,196,64,.5);background:rgba(143,196,64,.05)}
    .drop-zone-text{font-size:13px;color:#64748b;pointer-events:none}
    .drop-zone-text strong{color:#8FC440}
    .drop-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}

    /* Progress */
    .progress-bar{width:100%;height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:8px}
    .progress-fill{height:100%;background:linear-gradient(90deg,#8FC440,#D22881);border-radius:99px;transition:width .3s;width:0}

    /* Skeleton */
    .skeleton-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:24px;animation:pulse 1.5s infinite}
    .skel-line{height:14px;background:rgba(255,255,255,.08);border-radius:8px;margin-bottom:12px}
    .skel-line.w60{width:60%}
    .skel-line.w40{width:40%}
    .skel-line.w80{width:80%}
    .skel-line.w30{width:30%}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

    @media(max-width:600px){
      .login-card{padding:32px 24px}
      .docs-grid{grid-template-columns:1fr}
      #dashboard-section{padding:16px}
      .topbar{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>

<!-- Toasts -->
<div id="toast-container"></div>

<!-- Login -->
<section id="login-section">
  <div class="login-card">
    <div class="logo-wrap"><img src="/logo.jpg" alt="Logo Import Corporal Medical"></div>
    <h1>Panel Admin</h1>
    <p class="subtitle">Gestión de catálogos PDF</p>
    <form id="login-form">
      <div class="field">
        <label for="username">Usuario</label>
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="username" name="username" type="text" autocomplete="username" required placeholder="admin">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button id="login-btn" class="btn btn-primary" type="submit">Ingresar</button>
    </form>
  </div>
</section>

<!-- Dashboard -->
<section id="dashboard-section" class="hidden">
  <div class="topbar">
    <div>
      <h1>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8FC440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Catálogos PDF
      </h1>
      <p class="session-info" id="session-label"></p>
    </div>
    <div class="topbar-actions">
      <button id="refresh-btn" class="btn btn-ghost btn-sm" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Actualizar
      </button>
      <button id="logout-btn" class="btn btn-secondary btn-sm" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </div>
  <div id="docs-grid" class="docs-grid"></div>
</section>

<!-- Confirm Modal -->
<div id="confirm-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="modal-title">¿Confirmar acción?</h3>
    <p id="modal-message">Esta acción no se puede deshacer.</p>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn btn-ghost btn-sm">Cancelar</button>
      <button id="modal-confirm" class="btn btn-danger btn-sm">Eliminar</button>
    </div>
  </div>
</div>

<script>
// --- DOM refs ---
const loginSection = document.getElementById("login-section");
const dashboardSection = document.getElementById("dashboard-section");
const loginForm = document.getElementById("login-form");
const loginBtn = document.getElementById("login-btn");
const sessionLabel = document.getElementById("session-label");
const docsGrid = document.getElementById("docs-grid");
const refreshBtn = document.getElementById("refresh-btn");
const logoutBtn = document.getElementById("logout-btn");
const toastContainer = document.getElementById("toast-container");
const confirmModal = document.getElementById("confirm-modal");
const modalTitle = document.getElementById("modal-title");
const modalMessage = document.getElementById("modal-message");
const modalCancel = document.getElementById("modal-cancel");
const modalConfirm = document.getElementById("modal-confirm");

// --- Toast ---
function showToast(message, type = "info") {
  const el = document.createElement("div");
  el.className = "toast " + type;
  const icons = { ok: "✓", error: "✕", info: "ℹ" };
  el.innerHTML = "<span>" + (icons[type] || "") + "</span><span>" + message + "</span>";
  toastContainer.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, 3500);
}

// --- Modal ---
let modalResolver = null;
function showConfirmModal(title, message) {
  modalTitle.textContent = title;
  modalMessage.textContent = message;
  confirmModal.classList.remove("hidden");
  return new Promise((resolve) => { modalResolver = resolve; });
}
modalCancel.addEventListener("click", () => { confirmModal.classList.add("hidden"); if (modalResolver) modalResolver(false); });
modalConfirm.addEventListener("click", () => { confirmModal.classList.add("hidden"); if (modalResolver) modalResolver(true); });

// --- Navigation ---
function showLogin() { loginSection.classList.remove("hidden"); dashboardSection.classList.add("hidden"); }
function showDashboard(username) {
  sessionLabel.textContent = "Sesión activa: " + username;
  loginSection.classList.add("hidden");
  dashboardSection.classList.remove("hidden");
}

// --- Helpers ---
function formatBytes(bytes) {
  if (!bytes) return "—";
  const kb = bytes / 1024;
  return kb < 1024 ? kb.toFixed(1) + " KB" : (kb / 1024).toFixed(2) + " MB";
}
function formatDate(value) {
  if (!value) return "—";
  return new Date(value).toLocaleString("es-CO", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

// --- API ---
async function apiRequest(url, options) {
  const response = await fetch(url, { credentials: "include", cache: "no-store", ...options });
  let payload = {};
  try { payload = await response.json(); } catch (_) { payload = {}; }
  if (!response.ok) throw new Error(payload.error || "Error en la solicitud.");
  return payload;
}

// --- Skeleton ---
function showSkeletons() {
  let html = "";
  for (let i = 0; i < 6; i++) {
    html += '<div class="skeleton-card"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w80"></div><div class="skel-line w30"></div></div>';
  }
  docsGrid.innerHTML = html;
}

// --- Render ---
function renderDocuments(documents) {
  if (!documents.length) {
    docsGrid.innerHTML = '<p style="color:#64748b;text-align:center;grid-column:1/-1;padding:40px">No hay documentos configurados.</p>';
    return;
  }
  docsGrid.innerHTML = documents.map((doc) => {
    const exists = !!doc.exists;
    const pill = exists
      ? '<span class="pill ok"><span class="pill-dot"></span>Disponible</span>'
      : '<span class="pill off"><span class="pill-dot"></span>No disponible</span>';
    const viewDisabled = exists ? "" : "disabled";
    const deleteDisabled = exists ? "" : "disabled";
    return '<div class="doc-card" data-id="' + doc.id + '">' +
      '<div class="doc-card-header">' +
        '<div><div class="doc-card-title">' + doc.label + '</div>' +
        '<div class="doc-card-filename">' + doc.filename + '</div></div>' +
        pill +
      '</div>' +
      '<div class="doc-meta">' +
        '<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' + formatBytes(doc.size) + '</span>' +
        '<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' + formatDate(doc.updatedAt) + '</span>' +
      '</div>' +
      '<div class="doc-actions">' +
        '<div class="drop-zone" data-upload-id="' + doc.id + '">' +
          '<input type="file" accept=".pdf,application/pdf">' +
          '<div class="drop-zone-text">Arrastra un PDF o <strong>haz clic aquí</strong></div>' +
        '</div>' +
        '<div class="progress-bar hidden" data-progress="' + doc.id + '"><div class="progress-fill"></div></div>' +
        '<div class="doc-actions-row">' +
          (exists ? '<a class="btn btn-ghost btn-sm" href="' + doc.url + '" target="_blank" rel="noopener noreferrer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Ver PDF</a>' : '<button class="btn btn-ghost btn-sm" disabled>Ver PDF</button>') +
          '<button class="btn btn-danger btn-sm" data-delete-id="' + doc.id + '" data-label="' + doc.label + '" ' + deleteDisabled + '><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Eliminar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join("");
  attachCardHandlers();
}

// --- Handlers ---
function attachCardHandlers() {
  // Upload via drop zone
  for (const zone of document.querySelectorAll(".drop-zone[data-upload-id]")) {
    const id = zone.dataset.uploadId;
    const fileInput = zone.querySelector("input[type=file]");
    const progressBar = document.querySelector('[data-progress="' + id + '"]');
    const progressFill = progressBar.querySelector(".progress-fill");

    zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("dragover"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("dragover");
      if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; uploadFile(id, fileInput.files[0], progressBar, progressFill); }
    });
    fileInput.addEventListener("change", () => {
      if (fileInput.files.length) uploadFile(id, fileInput.files[0], progressBar, progressFill);
    });
  }
  // Delete
  for (const btn of document.querySelectorAll("button[data-delete-id]")) {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.deleteId;
      const label = btn.dataset.label;
      const confirmed = await showConfirmModal("Eliminar " + label, "¿Estás seguro? El archivo PDF se borrará del servidor y no se puede recuperar.");
      if (!confirmed) return;
      try {
        showToast("Eliminando...", "info");
        await apiRequest("/api/documents/delete?id=" + encodeURIComponent(id), { method: "DELETE" });
        showToast("Documento eliminado.", "ok");
        await loadDocuments();
      } catch (error) { showToast(error.message, "error"); }
    });
  }
}

async function uploadFile(id, file, progressBar, progressFill) {
  if (!file.name.toLowerCase().endsWith(".pdf")) { showToast("Solo se permiten archivos PDF.", "error"); return; }
  progressBar.classList.remove("hidden");
  progressFill.style.width = "0%";
  try {
    showToast("Subiendo PDF...", "info");
    const formData = new FormData();
    formData.append("pdf", file);
    // Simulate progress
    let pct = 0;
    const interval = setInterval(() => { pct = Math.min(pct + Math.random() * 15, 90); progressFill.style.width = pct + "%"; }, 200);
    await apiRequest("/api/documents/upload?id=" + encodeURIComponent(id), { method: "POST", body: formData });
    clearInterval(interval);
    progressFill.style.width = "100%";
    showToast("Documento actualizado correctamente.", "ok");
    setTimeout(async () => { progressBar.classList.add("hidden"); await loadDocuments(); }, 600);
  } catch (error) {
    progressBar.classList.add("hidden");
    showToast(error.message, "error");
  }
}

// --- Load ---
async function loadDocuments() {
  try {
    const response = await apiRequest("/api/documents?_=" + Date.now(), { method: "GET" });
    renderDocuments(response.documents || []);
  } catch (error) {
    if (error.message.toLowerCase().includes("no autorizado")) {
      showLogin();
      showToast("Tu sesión expiró. Ingresa de nuevo.", "error");
      return;
    }
    showToast(error.message, "error");
  }
}

// --- Session ---
async function checkSession() {
  try {
    const response = await apiRequest("/api/auth/session");
    if (response.authenticated) {
      showDashboard(response.username || "admin");
      showSkeletons();
      await loadDocuments();
    } else { showLogin(); }
  } catch (error) { showLogin(); }
}

// --- Login ---
loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const fd = new FormData(loginForm);
  const payload = { username: String(fd.get("username") || "").trim(), password: String(fd.get("password") || "") };
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<span class="spinner"></span> Validando...';
  try {
    const response = await apiRequest("/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    });
    showDashboard(response.username || payload.username);
    showToast("Bienvenido, " + (response.username || payload.username), "ok");
    showSkeletons();
    await loadDocuments();
  } catch (error) {
    showToast(error.message, "error");
  } finally {
    loginBtn.disabled = false;
    loginBtn.innerHTML = "Ingresar";
  }
});

// --- Refresh / Logout ---
refreshBtn.addEventListener("click", async () => {
  refreshBtn.disabled = true;
  showSkeletons();
  await loadDocuments();
  refreshBtn.disabled = false;
  showToast("Documentos actualizados.", "ok");
});

logoutBtn.addEventListener("click", async () => {
  try { await apiRequest("/api/auth/logout", { method: "POST" }); } catch (_) {}
  showLogin();
  showToast("Sesión cerrada.", "info");
});

// --- Init ---
checkSession();
</script>
</body>
</html>

services:
  - type: web
    name: catalogo-distribuidor
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: catalogo-pdfs
      mountPath: /var/data/catalogos
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PDF_STORAGE_DIR
        value: /var/data/catalogos
